<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Joias</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* paleta em harmonia com a Veri: verde profundo, verde sálvia e rosé */
    --bg:#f6f7f5; --surface:#fff; --ink:#24302b; --muted:#6c7a73; --line:#e1e7e3;
    --deep:#3b4e46; --sage:#7b9186; --rose:#d78e88; --rose-soft:#f7e6e3; --rose-ink:#9a524b;
    --photo:#f0f2f0; --green:#1e7a46; --green-ink:#fff;
    --radius:14px; --shadow:0 1px 2px rgba(36,48,43,.06),0 6px 18px rgba(36,48,43,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}

  /* Cabeçalho */
  header.top{background:var(--sage);color:#fff;padding:22px 0 18px;text-align:center}
  .brand{font-family:Poppins,Manrope,system-ui,sans-serif;font-weight:600;font-size:clamp(24px,6.4vw,34px);letter-spacing:.03em;margin:0;line-height:1.1}
  .tag{margin:6px 0 0;color:rgba(255,255,255,.88);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0 8px}
  .search{position:relative}
  .search input{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px 0 42px;font-size:15px;outline:none}
  .search input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(123,145,134,.22)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:500;margin-left:4px}
  .chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
  .chip[aria-pressed="true"] small{color:#c9d5cf}
  .row2{display:flex;gap:8px;align-items:center;padding-top:8px;overflow-x:auto;scrollbar-width:none}
  .row2::-webkit-scrollbar{display:none}
  .seg{display:flex;gap:6px;flex:0 0 auto}
  .seg .chip{padding:5px 12px;font-size:13px}
  select.sort{flex:0 0 auto;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 10px;font-size:13px}

  .count{color:var(--muted);font-size:13px;margin:14px 0 10px}

  /* Grade */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:120px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
  @media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;border:0;padding:0;text-align:left}
  .card .ph{aspect-ratio:1/1;background:var(--photo);position:relative;overflow:hidden}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .badges{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .badge{background:rgba(255,255,255,.92);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--ink)}
  .badge.gold{background:var(--rose-soft);color:var(--rose-ink)}
  .card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .desc{font-size:13px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
  .meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .dot.ouro{background:linear-gradient(135deg,#f3d58a,#c79a3b)}
  .dot.rodio{background:linear-gradient(135deg,#f1f3f5,#a7aeb5)}
  .dot.prata{background:linear-gradient(135deg,#ffffff,#c4c9ce)}
  .dot.misto{background:linear-gradient(90deg,#d9b05a 50%,#b9c0c6 50%)}
  .add{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:var(--shadow);display:grid;place-items:center}
  .add svg{width:18px;height:18px}
  .add.on{background:var(--deep);color:#fff}

  .open{all:unset;display:block;cursor:pointer;flex:1}
  .open:focus-visible{outline:2px solid var(--rose);outline-offset:-2px;border-radius:var(--radius)}
  .noimg{width:100%;height:100%;display:grid;place-items:center;color:#9fb0a7;font-size:12px;font-weight:600;letter-spacing:.06em;text-align:center}
  .noimg svg{width:34px;height:34px;display:block;margin:0 auto 6px}

  .empty{text-align:center;color:var(--muted);padding:60px 0}

  /* Sacolinha flutuante */
  .bagbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
  .bagbar button{pointer-events:auto;width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--deep);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(36,48,43,.28)}
  .bagbar[hidden]{display:none}

  /* Painel (detalhe e sacolinha) */
  .sheet{position:fixed;inset:0;z-index:40;display:none}
  .sheet.open{display:block}
  .sheet .backdrop{position:absolute;inset:0;background:rgba(28,38,34,.5)}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out}
  @media (min-width:760px){.panel{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);border-radius:20px;animation:none}}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .close{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:var(--shadow);font-size:20px;line-height:1}
  .carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--photo)}
  .carousel::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;position:relative}
  .slide img{width:100%;height:100%;object-fit:contain;display:block}
  .slide .lbl{position:absolute;left:10px;bottom:10px}
  .dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
  .dots span{width:6px;height:6px;border-radius:50%;background:#cfd8d3}
  .dots span.on{background:var(--deep)}
  .pbody{padding:14px 20px 4px}
  .pbody h2{font-family:Poppins,Manrope,system-ui,sans-serif;font-weight:600;font-size:21px;line-height:1.25;margin:4px 0 6px}
  .pbody .price{font-size:22px}
  dl.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0}
  dl.det dt{color:var(--muted)}
  dl.det dd{margin:0}
  .actions{display:flex;flex-direction:column;gap:10px;padding:8px 20px 6px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--deep);background:var(--surface);color:var(--deep)}
  .btn.primary{background:var(--deep);color:#fff}
  .btn.wa{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .btn svg{width:20px;height:20px}
  .small{font-size:12px;color:var(--muted);text-align:center;margin:6px 20px 0}

  .baglist{list-style:none;margin:0;padding:0 20px}
  .baglist li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .baglist img,.baglist .noimg{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--photo)}
  .baglist .t{font-size:13px;line-height:1.3}
  .baglist .t b{display:block;font-size:14px}
  .rm{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
  .total{display:flex;justify-content:space-between;padding:14px 20px;font-weight:700;font-size:17px}

  footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 16px 140px;line-height:1.6}
  .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1 class="brand" id="brand">Catálogo de Joias</h1>
    <p class="tag" id="tagline">Pronta-entrega</p>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <label class="search">
      <span class="vh">Buscar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar: coração, argola, zircônia, BR3844…" autocomplete="off">
    </label>
    <div class="chips" id="cats" role="group" aria-label="Categorias"></div>
    <div class="row2">
      <div class="seg" id="banhos" role="group" aria-label="Banho"></div>
      <select class="sort" id="sort" aria-label="Ordenar">
        <option value="cat">Ordenar: categoria</option>
        <option value="asc">Menor preço</option>
        <option value="desc">Maior preço</option>
      </select>
    </div>
  </div>
</div>

<main class="wrap">
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div id="foot"></div>
</footer>

<div class="bagbar" id="bagbar" hidden>
  <button id="openBag" type="button"><span id="bagTxt"></span><span>Ver sacolinha →</span></button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalhes">
  <div class="backdrop" data-close></div>
  <div class="panel" id="panel"></div>
</div>

}
function rotulo(i){ return `${i.modelo} – ${i.descricao} (${i.banho}${i.aro?`, aro ${i.aro}`:""})`; }
function waLink(texto){ const n=(CONFIG.whatsapp||"").replace(/\D/g,""); return `https://wa.me/${n}?text=${encodeURIComponent(texto)}`; }

/* ---------- Filtros ---------- */
function renderFiltros(){
  const cats = {};
  ITENS.forEach(i => cats[i.categoria] = (cats[i.categoria]||0) + i.qtd);
  const ordem = Object.keys(cats).sort((a,b)=> (CAT_ORDEM.indexOf(a)+99)%99 - (CAT_ORDEM.indexOf(b)+99)%99 || a.localeCompare(b));
  const total = ITENS.reduce((s,i)=>s+i.qtd,0);
  const infantil = ITENS.filter(i=>i.infantil).reduce((s,i)=>s+i.qtd,0);
  const lista = [["Todos",total], ...ordem.map(c=>[c,cats[c]]), ...(infantil?[["Infantil",infantil]]:[])];
  $("#cats").innerHTML = lista.map(([c,n]) => `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat===c}">${esc(PLURAL[c]||c)}<small>${n}</small></button>`).join("");

  const banhos = ["Todos", ...[...new Set(ITENS.map(i=>i.banho).filter(Boolean))].sort((a,b)=>a.localeCompare(b))];
  $("#banhos").innerHTML = banhos.map(b => `<button type="button" class="chip" data-banho="${esc(b)}" aria-pressed="${state.banho===b}">${b==="Todos"?"Todos os banhos":`<span class="dot ${dotClass(b)}"></span> ${esc(b)}`}</button>`).join("");
}

function filtrados(){
  const q = norm(state.q).trim();
  let r = ITENS.filter(i =>
    (state.cat==="Todos" || (state.cat==="Infantil" ? i.infantil : i.categoria===state.cat)) &&
    (state.banho==="Todos" || i.banho===state.banho) &&
    (!q || q.split(/\s+/).every(t => norm([i.modelo,i.descricao,i.categoria,i.subcategoria,i.banho,i.colecao].join(" ")).includes(t)))
  );
  if(state.sort==="asc") r.sort((a,b)=>a.valor-b.valor);
  else if(state.sort==="desc") r.sort((a,b)=>b.valor-a.valor);
  else r.sort((a,b)=> (CAT_ORDEM.indexOf(a.categoria)+99)%99 - (CAT_ORDEM.indexOf(b.categoria)+99)%99 || a.valor-b.valor);
  return r;
}

/* ---------- Grade ---------- */
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';

function renderGrade(){
  const r = filtrados();
  const pecas = r.reduce((s,i)=>s+i.qtd,0);
  $("#count").textContent = r.length ? (pecas===1 ? "1 peça disponível" : `${pecas} peças disponíveis`) : "";
  if(!r.length){ $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1">Nenhuma peça encontrada com esses filtros.</div>`; return; }
  $("#grid").innerHTML = r.map((i,ix) => {
    const on = state.bag.has(i.sku);
    const badges = [
      i.qtd>1 ? `<span class="badge">${i.qtd} unidades</span>` : "",
      i.fotos_modelo.length ? `<span class="badge gold">Foto com modelo</span>` : "",
      i.infantil ? `<span class="badge">Infantil</span>` : ""
    ].join("");
    return `<article class="card">
      <button type="button" class="open" data-open="${esc(i.sku)}" aria-label="Ver ${esc(rotulo(i))}">
        <div class="ph">${(i.capa||i.fotos[0]) ? img(i.capa||i.fotos[0], i.descricao, i.modelo, ix<6) : noImg(i.modelo)}<div class="badges">${badges}</div></div>
        <div class="info">
          <div class="price">${brl.format(i.valor)}</div>
          <div class="desc">${esc(i.descricao)}</div>
          <div class="meta"><span class="dot ${dotClass(i.banho)}"></span>${esc(i.banho||"")}${i.aro?` · Aro ${esc(i.aro)}`:""} · ${esc(i.modelo)}</div>
        </div>
      </button>
      <button type="button" class="add ${on?"on":""}" data-toggle="${esc(i.sku)}" aria-label="${on?"Remover da":"Adicionar à"} sacolinha" aria-pressed="${on}">${on?CHECK:PLUS}</button>
    </article>`;
  }).join("");
}

/* ---------- Sacolinha ---------- */
function bagItens(){ return [...state.bag.keys()].map(k => ITENS.find(i=>i.sku===k)).filter(Boolean); }
function renderBagBar(){
  const it = bagItens(); const tot = it.reduce((s,i)=>s+i.valor,0);
  $("#bagbar").hidden = !it.length;
  $("#bagTxt").textContent = `${it.length} ${it.length===1?"peça":"peças"} · ${brl.format(tot)}`;
}
function toggle(sku){ state.bag.has(sku) ? state.bag.delete(sku) : state.bag.set(sku,1); renderGrade(); renderBagBar(); }

const WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

function abrirSacolinha(){
  const it = bagItens(); const tot = it.reduce((s,i)=>s+i.valor,0);
  const msg = "Olá! Separei estas peças do catálogo:\n" + it.map(i=>`• ${rotulo(i)} – ${brl.format(i.valor)}`).join("\n") + `\n\nTotal: ${brl.format(tot)}`;
  $("#panel").innerHTML = `
    <button class="close" data-close aria-label="Fechar">×</button>
    <div class="pbody"><h2>Sua sacolinha</h2></div>
    ${it.length ? `<ul class="baglist">${it.map(i=>`<li>
        ${(i.capa||i.fotos[0])?img(i.capa||i.fotos[0],i.descricao,i.modelo,true):noImg(i.modelo)}
        <div class="t"><b>${brl.format(i.valor)}</b>${esc(i.descricao)}<br><span style="color:var(--muted)">${esc(i.banho)} · ${esc(i.modelo)}</span></div>
        <button class="rm" data-rm="${esc(i.sku)}">remover</button></li>`).join("")}</ul>
      <div class="total"><span>Total</span><span>${brl.format(tot)}</span></div>
      <div class="actions"><a class="btn wa" href="${waLink(msg)}" target="_blank" rel="noopener">${WA} Enviar pedido pelo WhatsApp</a></div>
      <p class="small">A disponibilidade é confirmada pela vendedora na conversa.</p>`
    : `<p class="small" style="padding:20px 0 30px">Sua sacolinha está vazia.</p>`}`;
  abrir();
}

/* ---------- Detalhe ---------- */
function abrirPeca(sku){
  const i = ITENS.find(x=>x.sku===sku); if(!i) return;
  const fotos = [...i.fotos.map(u=>({u,m:false})), ...i.fotos_modelo.map(u=>({u,m:true}))];
  const on = state.bag.has(i.sku);
  const linhas = [
    ["Código", i.modelo],
    ["Categoria", [i.categoria, i.subcategoria].filter(Boolean).join(" · ")],
    ["Banho", i.banho],
    i.aro ? ["Aro / tamanho", i.aro] : null,
    i.colecao ? ["Coleção", i.colecao] : null,
    i.qtd>1 ? ["Disponível", `${i.qtd} unidades`] : null
  ].filter(Boolean);
  $("#panel").innerHTML = `
    <button class="close" data-close aria-label="Fechar">×</button>
    <div class="carousel" id="car">${fotos.length ? fotos.map((f,ix)=>`<div class="slide">${img(f.u, i.descricao, i.modelo, ix===0)}${f.m?'<span class="badge gold lbl">Foto com modelo</span>':""}</div>`).join("") : `<div class="slide">${noImg(i.modelo)}</div>`}</div>
    ${fotos.length>1 ? `<div class="dots" id="dots">${fotos.map((_,ix)=>`<span class="${ix?"":"on"}"></span>`).join("")}</div>` : ""}
    <div class="pbody">
      <div class="price">${brl.format(i.valor)}</div>
      <h2>${esc(i.descricao)}</h2>
      <dl class="det">${linhas.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    </div>
    <div class="actions">
      <a class="btn wa" href="${waLink(`Olá! Tenho interesse nesta peça do catálogo:\n• ${rotulo(i)} – ${brl.format(i.valor)}`)}" target="_blank" rel="noopener">${WA} Quero esta peça</a>
      <button type="button" class="btn ${on?"":"primary"}" data-toggle-detail="${esc(i.sku)}">${on?"Remover da sacolinha":"Adicionar à sacolinha"}</button>
    </div>`;
  abrir();
  const car = $("#car"), dots = $("#dots");
  if(car && dots) car.addEventListener("scroll", () => {
    const k = Math.round(car.scrollLeft / car.clientWidth);
    [...dots.children].forEach((d,ix)=>d.classList.toggle("on", ix===k));
  }, {passive:true});
}

let ultimoFoco = null;
function abrir(){ ultimoFoco = document.activeElement; $("#sheet").classList.add("open"); document.body.style.overflow="hidden"; $("#panel").scrollTop=0; setTimeout(()=>$("#panel .close")?.focus(),30); }
function fechar(){ $("#sheet").classList.remove("open"); document.body.style.overflow=""; ultimoFoco?.focus?.(); }

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-cat],[data-banho],[data-open],[data-toggle],[data-toggle-detail],[data-close],[data-rm],#openBag");
  if(!t) return;
  if(t.dataset.cat){ state.cat=t.dataset.cat; renderFiltros(); renderGrade(); }
  else if(t.dataset.banho){ state.banho=t.dataset.banho; renderFiltros(); renderGrade(); }
  else if(t.dataset.open){ abrirPeca(t.dataset.open); }
  else if(t.dataset.toggle){ toggle(t.dataset.toggle); }
  else if(t.dataset.toggleDetail){ toggle(t.dataset.toggleDetail); abrirPeca(t.dataset.toggleDetail); }
  else if(t.dataset.rm){ toggle(t.dataset.rm); bagItens().length ? abrirSacolinha() : fechar(); }
  else if(t.id==="openBag"){ abrirSacolinha(); }
  else if("close" in t.dataset){ fechar(); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#sheet").classList.contains("open")) fechar(); });
$("#q").addEventListener("input", e => { state.q=e.target.value; renderGrade(); });
$("#sort").addEventListener("change", e => { state.sort=e.target.value; renderGrade(); });

/* ---------- Início ---------- */
document.title = CONFIG.nomeLoja;
$("#brand").textContent = CONFIG.nomeLoja;
$("#tagline").textContent = CONFIG.subtitulo;
$("#foot").innerHTML = `Preços em reais. Disponibilidade confirmada no atendimento.${CONFIG.atualizadoEm ? `<br>Atualizado em ${esc(CONFIG.atualizadoEm)}.` : ""}`;
renderFiltros(); renderGrade(); renderBagBar();
</script>
</body>
</html>
